<div class="p-6 mt-8">
  <!-- Header + Search -->
  <div class="content-address flex justify-between items-center mb-6">
    <h2>Stores Management</h2>
    <div class="input-group search-bar">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        placeholder="Search here..."
        class="border-0 search-input"
      />
      <button class="btn icon-button" type="button">
        <i class="pi pi-search"></i>
      </button>
    </div>
  </div>

  <!-- Cards -->
  <div class="row g-4">
    <div *ngFor="let store of filteredStores" class="col-sm-12 col-md-6 col-lg-4 col-xxl-3">
      <div class="card h-100">

        <!-- Store Images -->
        <div class="row g-2" *ngIf="store['images']?.length">
          <div 
            *ngFor="let img of store['images']" 
            class="{{ store.images?.length === 2 ? 'col-6 p-3' : 'col-12 p-3' }}"
          >
            <img [src]="img" alt="store" class="img-fluid rounded" />
          </div>
        </div>

        <!-- Card Body -->
        <div class="card-body">
          <h5 class="card-title">{{ store.name }}</h5>
          <p class="card-text">{{ store.location || 'No location provided' }}</p>
          <p class="card-text">Owner: {{ store.shopOwner || 'N/A' }}</p>
        </div>

        <!-- Card Footer -->
        <div class="card-footer">
          <p class="text-secondary mb-0">{{ store.numberOfProducts || 0 }} Products</p>
          <span class="btn" [ngClass]="store.status === 'active' ? 'btn-active' : 'btn-inactive'">
            {{ store.status }}
          </span>
        </div>

      </div>
    </div>
  </div>
</div>
