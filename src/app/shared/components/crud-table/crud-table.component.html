<p-table
  id="data-table"
  [value]="data"
  [paginator]="true"
  [rows]="5"
  [rowsPerPageOptions]="rowsPerPageOptions"
  paginatorPosition="bottom"
  [alwaysShowPaginator]="false"
  scrollable="true"
  class="custom-table"
>
  <!-- 🔹 Table Header -->
  <ng-template pTemplate="header">
    <tr>
      <th *ngFor="let col of columns" [style.width]="col.width">
        {{ col.header }}
      </th>
      <th style="width: 140px">Actions</th>
    </tr>
  </ng-template>

  <!-- 🔹 Table Body -->
  <ng-template pTemplate="body" let-row>
    <tr (click)="onRowClick(row)">
      <td *ngFor="let col of columns">
        <ng-container [ngSwitch]="col.field">
          <!-- ✅ Boolean Display -->
          <ng-container *ngSwitchCase="'hasOrder'">
            {{ row[col.field] ? "Yes" : "No" }}
          </ng-container>

          <!-- ✅ Status Display -->
          <ng-container *ngSwitchCase="'status'">
            <span
              class="status-badge"
              [ngClass]="'status-' + row.status?.toLowerCase()"
            >
              <i
                class="pi me-1"
                [ngClass]="{
                  'pi-check-circle': row.status?.toLowerCase() === 'active',
                  'pi-times-circle': row.status?.toLowerCase() === 'inactive' || row.status?.toLowerCase() === 'cancelled',
                  'pi-clock': row.status?.toLowerCase() === 'pending',
                  'pi-truck': row.status?.toLowerCase() === 'shipped',
                  'pi-box': row.status?.toLowerCase() === 'delivered'
                }"
              ></i>
              {{ row.status }}
            </span>
          </ng-container>

          <!-- ✅ Default Case -->
          <ng-container *ngSwitchDefault>
            {{ row[col.field] }}
          </ng-container>
        </ng-container>
      </td>

      <!-- 🔹 Actions -->
      <td class="actions-cell">
        <button
          pButton
          icon="pi pi-eye"
          class="p-button-sm p-button-text p-button-info"
          (click)="onView.emit(row)"
          tooltip="View"
        ></button>

       <button
        pButton
        icon="pi pi-pencil"
        class="p-button-sm p-button-text p-button-warning"
        (click)="router.navigate([basePath + '/edit', row.id])"
         tooltip="Edit">
       </button>


        <button
          pButton
          icon="pi pi-trash"
          class="p-button-sm p-button-text p-button-danger"
          (click)="confirmDelete(row)"
          tooltip="Delete"
        ></button>
      </td>
    </tr>
  </ng-template>
</p-table>
